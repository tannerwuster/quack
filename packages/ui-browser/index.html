<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <title>quack</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var name = localStorage.getItem("askdiff:theme");
          if (name === "custom") {
            root.setAttribute("data-theme", "custom");
            root.classList.add("dark");
            var active = localStorage.getItem("askdiff:custom-active");
            if (active) {
              var p = JSON.parse(active);
              var css = ':root[data-theme="custom"]{';
              for (var k in p) {
                if (Object.prototype.hasOwnProperty.call(p, k)) css += "--" + k + ":" + p[k] + ";";
              }
              css += "}";
              var st = document.createElement("style");
              st.id = "quack-custom-theme";
              st.textContent = css;
              document.head.appendChild(st);
            }
            return;
          }
          var known = ["light", "dark", "dracula", "cosmicgirl"];
          if (known.indexOf(name) === -1) {
            name = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
          }
          root.setAttribute("data-theme", name);
          if (name !== "light") root.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
